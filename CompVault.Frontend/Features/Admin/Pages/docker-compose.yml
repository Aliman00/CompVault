version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: otp_postgres
    environment:
      POSTGRES_USER: otpuser
      POSTGRES_PASSWORD: otppassword
      POSTGRES_DB: otpdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: